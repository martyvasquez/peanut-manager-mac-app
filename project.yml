name: PeanutManager
options:
  bundleIdPrefix: com.martyvasquez
  deploymentTarget:
    macOS: "26.0"
    iOS: "26.0"
  createIntermediateGroups: true
packages:
  LineupKit:
    path: Packages/LineupKit
settings:
  base:
    SWIFT_VERSION: "6.0"
    # The App Store version and build. Raise the build for every upload; the version for every release.
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
targets:
  PeanutManager:
    type: application
    platform: macOS
    sources:
      - PeanutManager
    dependencies:
      - package: LineupKit
        product: LineupKit
      - package: LineupKit
        product: LineupAI
    info:
      path: PeanutManager/Info.plist
      properties:
        CFBundleName: Peanut Manager
        CFBundleDisplayName: Peanut Manager
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSApplicationCategoryType: public.app-category.sports
        NSHumanReadableCopyright: AI lineups for youth baseball and softball.
        # HTTPS only (Apple's own encryption), so no export compliance documents.
        ITSAppUsesNonExemptEncryption: false
    # The App Sandbox, with only what the app uses. The first sandboxed launch moves the library into the
    # app's container (Resources/container-migration.plist).
    entitlements:
      path: PeanutManager/PeanutManager.entitlements
      properties:
        com.apple.security.app-sandbox: true
        # The AI services (OpenAI, Anthropic).
        com.apple.security.network.client: true
        # Sign in with ChatGPT returns to a listener on 127.0.0.1.
        com.apple.security.network.server: true
        # GameChanger CSV import.
        com.apple.security.files.user-selected.read-only: true
        com.apple.security.print: true
        # iCloud sync of the library (CloudKit) and the pushes that tell it something changed. Xcode signs
        # App Store builds with the production push environment.
        com.apple.developer.icloud-container-identifiers: [iCloud.com.martyvasquez.PeanutManager]
        com.apple.developer.icloud-services: [CloudKit]
        com.apple.developer.aps-environment: development
    settings:
      base:
        PRODUCT_NAME: Peanut Manager
        PRODUCT_MODULE_NAME: PeanutManager
        PRODUCT_BUNDLE_IDENTIFIER: com.martyvasquez.PeanutManager
        SWIFT_DEFAULT_ACTOR_ISOLATION: MainActor
        SWIFT_APPROACHABLE_CONCURRENCY: YES
        # Automatic signing on Marty's team: Apple Development for local builds (one certificate, so macOS sees
        # each build as the same app and keeps the keychain's Always Allow), Apple Distribution when archiving
        # for the App Store, and the provisioning profiles iCloud needs. Set it here, not in Xcode: XcodeGen
        # regenerates the project.
        CODE_SIGN_STYLE: Automatic
        CODE_SIGN_IDENTITY: "Apple Development"
        DEVELOPMENT_TEAM: G88C7HMHUJ
        ENABLE_HARDENED_RUNTIME: NO
        COMBINE_HIDPI_IMAGES: YES
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
  # The iPhone app. Shares the Mac app's model code (compiled from PeanutManager/, not copied) so the
  # library syncs through iCloud and the rules behave the same on both. The Mac target stays frozen at mac-1.0.
  PeanutPhone:
    type: application
    platform: iOS
    sources:
      - PeanutPhone
      - path: PeanutManager/Model
        excludes: [Navigator.swift]
      - path: PeanutManager/Views/Games/GameModel.swift
      - path: PeanutManager/Views/Shared/Field.swift
      - path: PeanutManager/App/FakeLLMClient.swift
      - path: PeanutManager/Printing/LineupCardView.swift
      - path: PeanutManager/Resources/sample-team.csv
        buildPhase: resources
      - path: PeanutManager/Resources/sample-ai.json
        buildPhase: resources
    dependencies:
      - package: LineupKit
        product: LineupKit
      - package: LineupKit
        product: LineupAI
    info:
      path: PeanutPhone/Info.plist
      properties:
        CFBundleDisplayName: Peanut Manager
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        UIBackgroundModes: [remote-notification]
        ITSAppUsesNonExemptEncryption: false
    entitlements:
      path: PeanutPhone/PeanutPhone.entitlements
      properties:
        com.apple.developer.icloud-container-identifiers: [iCloud.com.martyvasquez.PeanutManager]
        com.apple.developer.icloud-services: [CloudKit]
        aps-environment: development
    settings:
      base:
        PRODUCT_NAME: Peanut Manager
        PRODUCT_MODULE_NAME: PeanutPhone
        # The Mac app's bundle ID, so the App Store sells one app on both (universal purchase).
        PRODUCT_BUNDLE_IDENTIFIER: com.martyvasquez.PeanutManager
        TARGETED_DEVICE_FAMILY: "1"
        SWIFT_DEFAULT_ACTOR_ISOLATION: MainActor
        SWIFT_APPROACHABLE_CONCURRENCY: YES
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: G88C7HMHUJ
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
schemes:
  PeanutManager:
    build:
      targets:
        PeanutManager: all
  PeanutPhone:
    build:
      targets:
        PeanutPhone: all
