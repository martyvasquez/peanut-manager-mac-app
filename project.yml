name: PeanutManager
options:
  bundleIdPrefix: com.martyvasquez
  deploymentTarget:
    macOS: "26.0"
  createIntermediateGroups: true
packages:
  LineupKit:
    path: Packages/LineupKit
  Sparkle:
    url: https://github.com/sparkle-project/Sparkle
    exactVersion: 2.10.0
settings:
  base:
    SWIFT_VERSION: "6.0"
    MARKETING_VERSION: "2.0"
    CURRENT_PROJECT_VERSION: "1"
targets:
  PeanutManager:
    type: application
    platform: macOS
    sources:
      - PeanutManager
    dependencies:
      - package: LineupKit
        product: LineupKit
      - package: LineupKit
        product: LineupAI
      - package: Sparkle
    info:
      path: PeanutManager/Info.plist
      properties:
        CFBundleName: Peanut Manager
        CFBundleDisplayName: Peanut Manager
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSApplicationCategoryType: public.app-category.sports
        NSHumanReadableCopyright: AI lineups for youth baseball and softball.
        # Sparkle: never change the feed URL or public key; installed copies depend on them.
        SUFeedURL: https://github.com/martyvasquez/peanut-manager-mac-app/releases/latest/download/appcast.xml
        SUPublicEDKey: bKl1Ub2LkYTfePB3kMC3ouay0Ff4LU5wqp4pQqT8A0E=
        SUEnableAutomaticChecks: true
        SUAutomaticallyUpdate: true
        SUVerifyUpdateBeforeExtraction: true
    settings:
      base:
        PRODUCT_NAME: Peanut Manager
        PRODUCT_MODULE_NAME: PeanutManager
        PRODUCT_BUNDLE_IDENTIFIER: com.martyvasquez.PeanutManager
        SWIFT_DEFAULT_ACTOR_ISOLATION: MainActor
        SWIFT_APPROACHABLE_CONCURRENCY: YES
        CODE_SIGN_STYLE: Manual
        CODE_SIGN_IDENTITY: "-"
        DEVELOPMENT_TEAM: ""
        ENABLE_HARDENED_RUNTIME: NO
        ENABLE_APP_SANDBOX: NO
        COMBINE_HIDPI_IMAGES: YES
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
schemes:
  PeanutManager:
    build:
      targets:
        PeanutManager: all
